[package]
name = "binus-auth-spike"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "binus-auth-spike"

[[bin]]
name = "binus"
path = "src/binus.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "fs", "io-util", "signal"] }
tokio-tungstenite = "0.26"
tempfile = "3"
url = "2"
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Com", "Win32_UI_Shell"] }
