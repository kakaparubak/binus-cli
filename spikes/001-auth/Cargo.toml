[package]
name = "binus-auth-spike"
version = "0.1.0"
edition = "2024"
default-run = "binus-auth-spike"

[[bin]]
name = "binus"
path = "src/binus.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "fs", "io-util", "signal"] }
tokio-tungstenite = "0.26"
tempfile = "3"
url = "2"
rustix = { version = "1", features = ["fs", "process"] }
